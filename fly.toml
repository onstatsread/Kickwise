# fly.toml app configuration file generated for kickwise on 2026-09-25T20:37:14Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'kickwise'
primary_region = 'ams'

[build]

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-2x'
  memory = '2gb'
