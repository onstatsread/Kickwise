<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kickwise — Match Predictions</title>
<link rel="preconnect" href="https://googleapis.com">
<link href="https://googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --pitch:    #0A3D1F;
    --turf:     #0F5132;
    --lime:     #AAFF3C;
    --white:    #F5F7F2;
    --grey:     #8A9B82;
    --dark:     #07200F;
    --card:     #0D2918;
    --border:   rgba(170,255,60,0.15);
    --match:    #27AE60;
    --nomatch:  #C0392B;
    --double:   #8E44AD;
    --under:    #E67E22;
    --handicap: #2980B9;
    --low:      #16A085;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--dark);
    color: var(--white);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    min-height: 100vh;
  }

  header {
    background: var(--pitch);
    border-bottom: 2px solid var(--border);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--lime);
    line-height: 1;
  }
  .logo span { color: var(--white); }

  .tagline {
    font-size: 11px;
    color: var(--grey);
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .controls {
    padding: 20px;
    background: var(--pitch);
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .date-bar {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--lime);
  }

  .select-wrap { position: relative; }

  select {
    width: 100%;
    background: var(--card);
    color: var(--white);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 40px 12px 14px;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    appearance: none;
    cursor: pointer;
    outline: none;
    transition: border-color 0.2s;
  }
  select:focus { border-color: var(--lime); }

  .select-arrow {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--lime);
    pointer-events: none;
    font-size: 12px;
  }

  .run-btn {
    background: var(--lime);
    color: var(--dark);
    border: none;
    border-radius: 8px;
    padding: 14px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: opacity 0.2s, transform 0.1s;
    width: 100%;
  }
  .run-btn:active { transform: scale(0.98); opacity: 0.9; }
  .run-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  #status {
    padding: 16px 20px;
    min-height: 48px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--grey);
  }

  .spinner {
    width: 18px;
    height: 18px;
    border: 2px solid var(--border);
    border-top-color: var(--lime);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    flex-shrink: 0;
    display: none;
  }
  .spinner.active { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .empty { text-align: center; padding: 60px 20px; color: var(--grey); }
  .empty .icon { font-size: 48px; margin-bottom: 12px; }
  .empty h3 { font-family: 'Barlow Condensed', sans-serif; font-size: 20px; color: var(--white); margin-bottom: 6px; }
  .empty p { font-size: 14px; line-height: 1.5; }

  #results { padding: 12px 16px 32px; display: flex; flex-direction: column; gap: 12px; }

  .league-header {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--lime);
    padding: 8px 0 4px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 4px;
  }

  .match-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 12px;
    animation: fadeIn 0.3s ease both;
  }
  @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }

  .match-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    background: var(--turf);
    border-bottom: 1px solid var(--border);
  }
  .match-time {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--lime);
    letter-spacing: 0.5px;
  }
  .match-teams {
    text-align: right;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.3px;
  }
  .match-teams .vs { color: var(--grey); font-weight: 400; margin: 0 6px; }

  .result-section { padding: 12px 14px; border-bottom: 1px solid var(--border); }
  .result-section:last-child { border-bottom: none; }

  .result-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--grey);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .result-label::before {
    content: '';
    display: block;
    width: 3px;
    height: 10px;
    background: var(--lime);
    border-radius: 2px;
  }
  .result-label.rev::before { background: var(--under); }

  .result-pills { display: flex; flex-wrap: wrap; gap: 6px; }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.3px;
    white-space: nowrap;
  }
  .pill-label { font-size: 10px; font-weight: 400; opacity: 0.75; text-transform: uppercase; letter-spacing: 0.5px; margin-right: 4px; }

  .pill.match    { background: rgba(39,174,96,0.2);  color: #6EE7A0; border: 1px solid rgba(39,174,96,0.4); }
  .pill.nomatch  { background: rgba(192,57,43,0.2);  color: #F1948A; border: 1px solid rgba(192,57,43,0.4); }
  .pill.double   { background: rgba(142,68,173,0.2); color: #D7A9F0; border: 1px solid rgba(142,68,173,0.4); }
  .pill.under    { background: rgba(230,126,34,0.2); color: #F0B27A; border: 1px solid rgba(230,126,34,0.4); }
  .pill.handicap { background: rgba(41,128,185,0.2); color: #85C1E9; border: 1px solid rgba(41,128,185,0.4); }
  .pill.low      { background: rgba(22,160,133,0.2); color: #76D7C4; border: 1px solid rgba(22,160,133,0.4); }
  .pill.neutral  { background: rgba(138,155,130,0.15); color: var(--grey); border: 1px solid rgba(138,155,130,0.2); }
  .pill.empty    { background: transparent; color: var(--grey); border: 1px dashed rgba(138,155,130,0.2); font-style: italic; font-weight: 400; }

  .error-card {
    background: rgba(192,57,43,0.12);
    border: 1px solid rgba(192,57,43,0.35);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 13px;
    color: #F1948A;
  }

  footer { text-align: center; padding: 20px; font-size: 11px; color: var(--grey); border-top: 1px solid var(--border); }

  @media(min-width:640px) {
    .controls { flex-direction: row; align-items: flex-end; flex-wrap: wrap; }
    .select-wrap { flex: 1; min-width: 260px; }
    .run-btn { width: auto; padding: 13px 28px; flex-shrink: 0; }
    #results { padding: 16px 24px 40px; }
  }
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">Kick<span>wise</span></div>
    <div class="tagline">Match Prediction Engine</div>
  </div>
</header>

<div class="controls">
  <div class="date-bar" id="dateBar">-</div>
  <div class="select-wrap">
    <select id="leagueSelect"></select>
    <span class="select-arrow">▼</span>
  </div>
  <button class="run-btn" id="runBtn" onclick="runAnalysis()">⚡ Analyze Today</button>
</div>

<div id="status">
  <div class="spinner" id="spinner"></div>
  <span id="statusText">Select a league and tap Analyze Today</span>
</div>

<div id="results"></div>

<footer>Kickwise • Data from AnnaBet via A_mix2 Model</footer>

<script>
const LEAGUES = [
    ["Argentina - Liga Profesional", "argentina"],
    ["Austria - Bundesliga", "austria"],
    ["Belgium - Pro League", "belgium"],
    ["Brazil - Serie A", "brazil"],
    ["Brazil - Serie B", "brazil2"],
    ["Chile - Liga de Primera", "chile"],
    ["China - Super League", "china"],
    ["Denmark - Superligaen", "denmark"],
    ["England - Premier League", "england"],
    ["England - Championship", "england2"],
    ["England - League One", "england3"],
    ["England - League Two", "england4"],
    ["Finland - Veikkausliiga", "finland"],
    ["France - Ligue 1", "france"],
    ["Germany - Bundesliga", "germany"],
    ["Germany - 2. Bundesliga", "germany2"],
    ["Germany - 3. Liga", "germany3"],
    ["Greece - Super League", "greece"],
    ["Ireland - Premier Division", "ireland"],
    ["Italy - Serie A", "italy"],
    ["Italy - Serie B", "italy2"],
    ["Mexico - Liga MX", "mexico"],
    ["Netherlands - Eredivisie", "netherlands"],
    ["Norway - Eliteserien", "norway"],
    ["Poland - Ekstraklasa", "poland"],
    ["Portugal - Liga Portugal", "portugal"],
    ["Russia - Premier League", "russia"],
    ["Scotland - Premiership", "scotland"],
    ["South Korea - K League 1", "southkorea"],
    ["Spain - LaLiga", "spain"],
    ["Sweden - Allsvenskan", "sweden"],
    ["Sweden - Superettan", "sweden2"],
    ["Switzerland - Super League", "switzerland"],
    ["Turkey - Super Lig", "turkey"],
    ["USA - MLS", "usa"]
];

// NOTE: set to your actual live Render service URL
const API_BASE = "https://kickwise-v2.onrender.com";

// Populate dropdown select element
const sel = document.getElementById("leagueSelect");
if (sel) {
    LEAGUES.forEach(([name, code]) => {
        const opt = document.createElement("option");
        opt.value = code;
        opt.textContent = name;
        sel.appendChild(opt);
    });
}

// Set date bar to today's date, human readable
function setDateBar() {
    const bar = document.getElementById("dateBar");
    if (!bar) return;
    const today = new Date();
    const opts = { weekday: "long", day: "numeric", month: "long" };
    bar.textContent = today.toLocaleDateString("en-GB", opts);
}
setDateBar();

const statusEl   = document.getElementById("statusText");
const spinnerEl  = document.getElementById("spinner");
const resultsEl  = document.getElementById("results");
const runBtn     = document.getElementById("runBtn");

function setStatus(text, loading) {
    statusEl.textContent = text;
    spinnerEl.classList.toggle("active", !!loading);
}

// ── Pill helpers ─────────────────────────────────────────────
function pillClassFor(value) {
    if (value === null || value === undefined || value === "") return "empty";
    const v = String(value).toLowerCase();
    if (v.includes("double")) return "double";
    if (v.includes("under")) return "under";
    if (v.includes("handicap")) return "handicap";
    if (v === "home" || v === "away" || v.includes("confirmed") || v === "over") return "match";
    if (v.includes("no") || v.includes("run")) return "nomatch";
    return "neutral";
}

function pill(label, value) {
    const display = (value === null || value === undefined || value === "") ? "—" : value;
    const cls = pillClassFor(value);
    return `<span class="pill ${cls}"><span class="pill-label">${label}</span>${display}</span>`;
}

function section(label, pillsHtml, rev) {
    return `
      <div class="result-section">
        <div class="result-label${rev ? " rev" : ""}">${label}</div>
        <div class="result-pills">${pillsHtml}</div>
      </div>`;
}

// ── Odds formatting ──────────────────────────────────────────
function oddsPills(oddsObj, prefix) {
    if (!oddsObj) return pill(prefix, "—");
    return [
        pill(prefix + " Home", oddsObj.home_odds),
        pill(prefix + " Draw", oddsObj.draw_odds),
        pill(prefix + " Away", oddsObj.away_odds),
    ].join("");
}

function ou25OddsPills(oddsObj, prefix) {
    if (!oddsObj) return pill(prefix, "—");
    return [
        pill(prefix + " Over", oddsObj.over_odds),
        pill(prefix + " Under", oddsObj.under_odds),
    ].join("");
}

// ── Render one match card from /predict response ────────────
function renderMatchCard(fixture, data) {
    const time = fixture.time || "";
    const home = data.home || fixture.home;
    const away = data.away || fixture.away;

    const hdaDecision = (data.value_signal && data.value_signal.decision) || "";
    const hdaUnder    = (data.value_signal && data.value_signal.under) || "";
    const ouStep4      = (data.ou25_value_signal && data.ou25_value_signal.step4) || "";
    const ouStep5      = (data.ou25_value_signal && data.ou25_value_signal.step5) || "";
    const ouStep6      = (data.ou25_value_signal && data.ou25_value_signal.step6) || "";
    const ouResult      = (data.ou25_value_signal && data.ou25_value_signal.result) || "";
    const prediction3   = data.prediction_3 || "";

    let html = `
      <div class="match-card">
        <div class="match-header">
          <span class="match-time">${time}</span>
          <span class="match-teams">${home}<span class="vs">vs</span>${away}</span>
        </div>`;

    // Prediction 1 (forward direction)
    html += section("Prediction 1", [
        pill("D70", data.d70),
        pill("B120", data.b120),
        pill("C120", data.c120),
        pill("B46", data.b46),
        pill("D64", data.d64),
        pill("B118", data.b118),
        pill("AA15", data.aa15),
        pill("B54", data.b54),
        pill("B119", data.b119),
        pill("D119", data.d119),
        pill("D70 val", data.d70val),
        pill("O73", data.o73),
        pill("O74", data.o74),
    ].join(""));

    // Prediction 2 (reverse direction)
    html += section("Prediction 2 (Reverse)", [
        pill("D70", data.d70r),
        pill("B120", data.b120r),
        pill("C120", data.c120r),
        pill("B46", data.b46r),
        pill("D64", data.d64r),
        pill("B118", data.b118r),
        pill("AA15", data.aa15r),
        pill("B54", data.b54r),
        pill("B119", data.b119r),
        pill("D119", data.d119r),
        pill("D70 val", data.d70valr),
        pill("O73", data.o73r),
        pill("O74", data.o74r),
    ].join(""), true);

    // Model odds
    html += section("Model Odds (H/D/A)", oddsPills(data.odds, "Model"));

    // Market odds
    html += section("Market Odds (H/D/A)", oddsPills(data.market_odds, "Market"));

    // H/D/A Value + Decision
    const vp = data.value_pct || {};
    html += section("H/D/A Value %", [
        pill("Home", vp.home != null ? vp.home + "%" : null),
        pill("Draw", vp.draw != null ? vp.draw + "%" : null),
        pill("Away", vp.away != null ? vp.away + "%" : null),
        pill("Total", vp.total != null ? vp.total + "%" : null),
        pill("Share Diff", vp.share_diff != null ? vp.share_diff + "%" : null),
    ].join(""));

    html += section("H/D/A Decision", [
        pill("Decision", hdaDecision),
        pill("Under", hdaUnder),
    ].join(""));

    // Model / Market O/U 2.5 odds
    html += section("Model O/U 2.5 Odds", ou25OddsPills(data.ou25, "Model"));
    html += section("Market O/U 2.5 Odds", ou25OddsPills(data.market_ou25, "Market"));

    // O/U value %
    const oup = data.ou25_value_pct || {};
    html += section("O/U 2.5 Value %", [
        pill("Over", oup.over != null ? oup.over + "%" : null),
        pill("Under", oup.under != null ? oup.under + "%" : null),
        pill("Total", oup.total != null ? oup.total + "%" : null),
        pill("Over Share", oup.over_share != null ? oup.over_share + "%" : null),
        pill("Under Share", oup.under_share != null ? oup.under_share + "%" : null),
        pill("Abs Diff", oup.abs_diff != null ? oup.abs_diff + "%" : null),
    ].join(""));

    // O/U signal steps + result
    html += section("O/U Signal (Steps 4–6)", [
        pill("Step 4", ouStep4),
        pill("Step 5", ouStep5),
        pill("Step 6", ouStep6),
        pill("Result", ouResult),
    ].join(""));

    // Prediction 3 — the cross-check result
    html += section("Prediction 3", pill("Result", prediction3));

    html += `</div>`;
    return html;
}

// ── Main flow: fetch fixtures for selected league, then predict each ──
async function runAnalysis() {
    const league = sel.value;
    if (!league) {
        setStatus("Pick a league first.");
        return;
    }

    runBtn.disabled = true;
    resultsEl.innerHTML = "";
    setStatus("Fetching today's fixtures…", true);

    try {
        const fxResp = await fetch(`${API_BASE}/fixtures?league=${encodeURIComponent(league)}`);
        if (!fxResp.ok) throw new Error(`Fixtures request failed (${fxResp.status})`);
        const fxData = await fxResp.json();
        const matches = fxData.matches || [];

        if (matches.length === 0) {
            resultsEl.innerHTML = `
              <div class="empty">
                <div class="icon">📭</div>
                <h3>No fixtures today</h3>
                <p>No matches found for this league today. Try another league or check back later.</p>
              </div>`;
            setStatus("No fixtures found.");
            runBtn.disabled = false;
            return;
        }

        setStatus(`Found ${matches.length} match(es). Running predictions…`, true);

        const leagueName = (LEAGUES.find(l => l[1] === league) || [league])[0];
        let html = `<div class="league-header">${leagueName}</div>`;
        resultsEl.innerHTML = html;

        // Run predictions sequentially so status can update per match
        // (kept sequential rather than Promise.all to avoid hammering the
        // free-tier backend with a burst of concurrent LibreOffice runs)
        for (let i = 0; i < matches.length; i++) {
            const m = matches[i];
            setStatus(`Analyzing ${i + 1}/${matches.length}: ${m.home} vs ${m.away}…`, true);
            try {
                const params = new URLSearchParams({ league, home: m.home, away: m.away });
                const predResp = await fetch(`${API_BASE}/predict?${params.toString()}`);
                if (!predResp.ok) throw new Error(`Predict failed (${predResp.status})`);
                const predData = await predResp.json();
                resultsEl.insertAdjacentHTML("beforeend", renderMatchCard(m, predData));
            } catch (err) {
                resultsEl.insertAdjacentHTML("beforeend", `
                  <div class="error-card">
                    Couldn't get a prediction for <strong>${m.home} vs ${m.away}</strong>: ${err.message}
                  </div>`);
            }
        }

        setStatus(`Done — ${matches.length} match(es) analyzed.`);
    } catch (err) {
        resultsEl.innerHTML = `
          <div class="error-card">
            Something went wrong: ${err.message}. Check that the backend is awake (Render free tier can take ~50s to spin up) and try again.
          </div>`;
        setStatus("Failed to load fixtures.");
    } finally {
        runBtn.disabled = false;
        spinnerEl.classList.remove("active");
    }
}
</script>

</body>
</html>
