name: Train Kickwise V1 model

on:
  workflow_dispatch: {}      # run it by hand from the Actions tab (e.g. once a week)

permissions:
  contents: write

concurrency:
  group: train-kickwise-model
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned libraries
        run: pip install -r requirements_model.txt

      - name: Train the model
        run: python train_kickwise_v1.py

      - name: Save the model and report to the repo
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add kickwise_random_forest_v1.joblib kickwise_v1_report.txt
          git commit -m "retrain kickwise v1 model" || echo "no changes"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "Push failed (attempt $i), retrying..."
            sleep 5
          done
          exit 1
