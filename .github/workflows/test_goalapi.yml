name: Test GOAL API

on:
  workflow_dispatch:

jobs:
  test_goalapi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run GOAL API test
        env:
          GOAL_API_KEY: ${{ secrets.GOAL_API_KEY }}
        run: python test_goalapi.py
