name: Test AnnaBet Accessibility

on:
  workflow_dispatch:  # manual trigger only — one-off test

jobs:
  test_annabet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - - name: Run AnnaBet test
        run: python check_annabet_gp.py
