name: Check Oddsbook OU25

on:
  workflow_dispatch:

jobs:
  check_ou25:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright beautifulsoup4
          playwright install --with-deps chromium

      - name: Run OU25 check
        run: python check_oddsbook_ou25.py
