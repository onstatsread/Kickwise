name: Extract predictions
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python extract_predictions.py crawl https://kickwisepredictions.blogspot.com all_predictions.csv
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add all_predictions.csv
          git commit -m "update predictions" || echo "no changes"
          git push
