name: Extract predictions
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python extract_predictions.py crawl https://kickwisepredictions.blogspot.com all_predictions.csv
      - run: python extract_predictions.py scores all_predictions.csv scores.csv
        env:
          GOAL_API_KEY: ${{ secrets.GOAL_API_KEY }}
      - run: |
          python extract_predictions.py merge all_predictions.csv scores.csv analysis.csv
          python extract_predictions.py analyze analysis.csv | tee report.txt
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add all_predictions.csv scores.csv analysis.csv report.txt filter_report.txt filter_picks.csv 
          git commit -m "update" || echo "no changes"
          git push
