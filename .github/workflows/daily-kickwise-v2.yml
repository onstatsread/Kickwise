name: Kickwise Daily Predictions V2 (GOAL API)

on:
  workflow_dispatch: {}      # manual / outside cron service only
  # To let GitHub run it by itself, remove the "#" from the 3 lines below:
  # schedule:
  #   - cron: '30 23 * * *'

jobs:
  run-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests -r requirements_model.txt

      - name: Run daily predictions v2
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          BLOG_ID: ${{ secrets.BLOG_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          BLOG_ID_2: ${{ secrets.BLOG_ID_2 }}
          GOOGLE_CLIENT_ID_2: ${{ secrets.GOOGLE_CLIENT_ID_2 }}
          GOOGLE_CLIENT_SECRET_2: ${{ secrets.GOOGLE_CLIENT_SECRET_2 }}
          GOOGLE_REFRESH_TOKEN_2: ${{ secrets.GOOGLE_REFRESH_TOKEN_2 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOTS: ${{ secrets.TELEGRAM_BOTS }}
          BLOG_ID_V2: ${{ secrets.BLOG_ID_V2 }}
          BLOG_ID_2_V2: ${{ secrets.BLOG_ID_2_V2 }}
        run: python daily_predictions_v2.py
